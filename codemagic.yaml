# Codemagic — Mac を持たずに iOS アプリをビルド & App Store Connect へ提出する。
#
# 事前準備（Codemagic の管理画面で1回だけ）:
#  1. codemagic.io に GitHub でログイン → このリポジトリ (R2V) を Add application
#  2. Teams → Integrations → App Store Connect
#       App Store Connect(→ Users and Access → Integrations → App Store Connect API)で
#       API キー(.p8 / Key ID / Issuer ID)を発行してアップロード。
#       付けた名前を下の `integrations.app_store_connect` に書く。
#  3. Environment variables で変数グループ `supabase` を作成し、次を追加:
#       NEXT_PUBLIC_SUPABASE_URL       = https://atbkhwlhtpkmpgysvlyt.supabase.co
#       NEXT_PUBLIC_SUPABASE_ANON_KEY  = sb_publishable_...
#  4. 下の BUNDLE_ID を自分のものに変更（例 com.koooooojima.r2l）。
#     developer.apple.com → Certificates, IDs & Profiles → Identifiers で
#     同じ ID を事前登録しておく。
#  5. アプリアイコン: resources/icon.png (1024x1024, 透過なし) を置くと自動生成。
#     無い場合はデフォルトアイコンでビルドされる（審査で要差し替え）。

workflows:
  ios-appstore:
    name: R2L iOS – App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: R2L_ASC_API_KEY   # ← 手順2で付けた統合名に変更
    environment:
      groups:
        - supabase
      vars:
        BUNDLE_ID: "com.roadtolexus.r2l"        # ← 自分の Bundle ID に変更
        APPLE_TEAM_ID: "RRV3NJ2268"             # ← developer.apple.com の Team ID
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: npm install
        script: npm install --no-audit --no-fund

      - name: Web を静的書き出し (out/)
        script: npm run build:mobile

      - name: iOS プラットフォームを用意
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios
          # 輸出コンプライアンス: 標準HTTPSのみ＝適用除外（毎回の質問を回避）
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

      - name: アプリアイコン生成
        script: |
          node scripts/make-icon.mjs
          npx @capacitor/assets generate --ios --iconBackgroundColor '#16181C' --iconBackgroundColorDark '#16181C'

      - name: バージョン / ビルド番号
        script: |
          cd ios/App
          agvtool new-marketing-version 1.0.0
          agvtool new-version -all $(( $(date +%s) / 60 ))

      - name: CocoaPods
        script: |
          cd ios/App && pod install

      - name: コード署名の準備
        script: |
          keychain initialize
          # 秘密鍵を生成し、その鍵で新規の配布証明書＋App Store プロファイルを作成。
          # 注: ビルドのたびに新しい証明書が作られる。Apple の上限（配布証明書 2〜3枚）
          # に達したら、作成済み .p12 を Codemagic に保存する方式へ切り替えること。
          CERT_KEY="$(mktemp)"
          openssl genrsa 2048 > "$CERT_KEY"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$CERT_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "ios/App/App.xcodeproj"

      - name: IPA をビルド
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # App Store Connect にアップロードのみ（内部TestFlight/審査提出は画面から手動）。
        # 外部TestFlightベータ審査に出したい場合のみ submit_to_testflight: true
        # （その際は App Store Connect でテスト情報の入力が必要）。
        submit_to_testflight: false
